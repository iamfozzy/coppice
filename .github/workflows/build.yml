name: Build & Release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish (for example v0.1.64)
        required: false
        type: string
      release_ref:
        description: Git ref to build (for example refs/tags/v0.1.64)
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.release_ref != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin the macOS runner to arm64. `macos-latest` is currently arm64
          # but can change underneath us, so the target is set explicitly.
          - platform: macos-15
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: "--bundles deb"
            rust_target: ""
          - platform: windows-latest
            args: ""
            rust_target: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For pull_request runs, checkout the head commit instead of the
          # ephemeral refs/pull/*/merge ref. That merge ref can disappear if the
          # PR is merged while a queued matrix job is still starting.
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          # workflow_dispatch is used by auto-release after it creates and pushes
          # the release tag with GITHUB_TOKEN. That token push does not trigger
          # a separate push workflow, so we explicitly dispatch this workflow and
          # build the pushed tag ref here.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
          fetch-depth: 0

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install upstream rustup (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # GitHub macOS images can ship a Homebrew rustup/rustup-init that
          # breaks cargo subcommands such as `cargo metadata`. Install the
          # upstream rustup first and put it ahead of Homebrew on PATH.
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -fsSL https://sh.rustup.rs -o rustup-init.sh
          sh rustup-init.sh -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Verify Rust toolchain
        shell: bash
        run: |
          command -v rustup
          rustup --version
          command -v cargo
          cargo --version
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --no-deps > /dev/null

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Install agent-bridge dependencies
        shell: bash
        run: |
          npm ci
          # linuxdeploy (AppImage bundler) resolves dependencies for every .so
          # under the AppDir. sharp ships a musl variant with os: [linux] but no
          # libc constraint, so npm installs it on glibc Ubuntu — then
          # linuxdeploy fails trying to find libc.musl-x86_64.so.1.
          rm -rf node_modules/@img/sharp-linuxmusl-* node_modules/@img/sharp-libvips-linuxmusl-*
        working-directory: src-tauri/resources/agent-bridge

      - name: Determine target triple
        id: target
        shell: bash
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            echo "triple=${{ matrix.rust_target }}" >> "$GITHUB_OUTPUT"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            echo "triple=x86_64-unknown-linux-gnu" >> "$GITHUB_OUTPUT"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            echo "triple=x86_64-pc-windows-msvc" >> "$GITHUB_OUTPUT"
          else
            echo "triple=aarch64-apple-darwin" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch agent-bridge SDK
        shell: bash
        run: node scripts/patch-agent-bridge.mjs

      - name: Prune agent-bridge for target
        shell: bash
        run: node scripts/prune-agent-bridge.mjs ${{ steps.target.outputs.triple }}

      - name: Download node + gh sidecars for target
        shell: bash
        run: node scripts/download-sidecars.mjs ${{ steps.target.outputs.triple }}

      - name: Build with Tauri
        shell: bash
        run: |
          set -e
          attempt=1
          max_attempts=3
          while true; do
            if npx tauri build --verbose ${{ matrix.args }}; then
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::tauri build failed after $attempt attempts"
              exit 1
            fi
            echo "::warning::tauri build attempt $attempt failed; cleaning up and retrying"
            if [ "$RUNNER_OS" = "macOS" ]; then
              # bundle_dmg.sh's `hdiutil detach` can intermittently time out
              # (DiskArbitration), leaving the DMG mounted at /Volumes/dmg.*
              # and failing the bundle step. Force-detach any leftover mounts
              # so the retry can proceed.
              hdiutil info | awk '
                /^\/dev\/disk/ { disk=$1 }
                /\/Volumes\/dmg\./ { print disk }
              ' | while read -r d; do
                echo "Force-detaching stuck DMG mount: $d"
                hdiutil detach -force "$d" || true
              done
            fi
            attempt=$((attempt+1))
            sleep 5
          done
        env:
          NO_STRIP: ${{ matrix.platform == 'ubuntu-22.04' && 'true' || '' }}
          APPIMAGE_EXTRACT_AND_RUN: ${{ matrix.platform == 'ubuntu-22.04' && '1' || '' }}

      - name: List bundle output (Unix)
        if: always() && runner.os != 'Windows'
        run: |
          find src-tauri/target -path "*/release/bundle*" -type f || echo "No bundle files found"

      - name: List bundle output (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target -Filter "bundle" -Directory -ErrorAction SilentlyContinue | Get-ChildItem -Recurse -File | Select-Object FullName

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coppice-${{ matrix.platform }}-${{ matrix.rust_target || 'native' }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.nsis.zip
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine version tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          draft: false
          generate_release_notes: true
          make_latest: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.nsis.zip
